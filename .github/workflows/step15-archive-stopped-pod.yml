name: TriQTO Step-15 Archive Stopped Pod Control Record

on:
  push:
    branches: [main]
    paths:
      - "runpod/step15-archive/*.json"

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_S3_ENDPOINT: ${{ vars.RUNPOD_S3_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check boto3
      - name: Archive exact stopped pod after verifying RunPod 404
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, subprocess, sys
          from pathlib import Path
          sys.path.insert(0,str(Path("scripts").resolve()))
          import runpod_control_v2 as control
          changed=subprocess.check_output(["git","diff","--name-only","HEAD^","HEAD","--","runpod/step15-archive/*.json"],text=True).splitlines()
          if len(changed)!=1 or not re.fullmatch(r"runpod/step15-archive/[A-Za-z0-9._-]+[.]json",changed[0]):
              raise RuntimeError("Requires exactly one archival request")
          req=json.loads(Path(changed[0]).read_text())
          if set(req)!={"id","job_id","control_run_id","pod_id","image_name"}:
              raise RuntimeError("Unexpected archival request")
          if not req["job_id"].startswith("step15-audit-literal-positive-"):
              raise RuntimeError("Unsupported job identity")
          if not re.fullmatch(r"run-[0-9]+-[a-z0-9]+",req["control_run_id"]):
              raise RuntimeError("Unexpected control run")
          key=control.active_key(req["control_run_id"])
          record=control.read_json_object(key)
          if record is None:
              archived=control.read_json_object(control.history_key(req["control_run_id"]))
              if archived is not None and archived.get("pod_id")==req["pod_id"]:
                  print(json.dumps({"status":"ALREADY_ARCHIVED","control_run_id":req["control_run_id"]}),flush=True)
                  raise SystemExit(0)
              raise RuntimeError("Active record absent and no matching archive")
          for field,expected in [
              ("job_id",req["job_id"]),("control_run_id",req["control_run_id"]),
              ("pod_id",req["pod_id"]),("image_name",req["image_name"]),
          ]:
              if record.get(field)!=expected:
                  raise RuntimeError("Archived identity mismatch on "+field)
          try:
              pod=control.runpod_request("GET","/pods/"+req["pod_id"])
          except RuntimeError as exc:
              if "HTTP 404" not in str(exc):
                  raise
          else:
              raise RuntimeError("Refusing archive: target pod still visible "+str(pod.get("desiredStatus")))
          status=control.read_json_object(control.status_key(req["job_id"],req["control_run_id"]))
          control.archive_active(key,record,
              outcome="failsafe_stopped_after_scientific_replay_failure",
              detail={
                  "request_id":req["id"],
                  "verified_pod_absent_http_404":True,
                  "last_worker_status":status,
                  "science_artifacts_modified":False,
              })
          print(json.dumps({"status":"ARCHIVED_STOPPED_STEP15_POD","control_run_id":req["control_run_id"],"pod_id":req["pod_id"]}),flush=True)
          PY
