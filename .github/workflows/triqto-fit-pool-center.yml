name: TriQTO FIT-only pooled calibration source diagnostic
on:
  push:
    branches: [research/stabilization-gates-20261025]
    paths: ['.github/workflows/triqto-fit-pool-center.yml']
permissions:
  contents: read
jobs:
  calibration-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet "numpy==2.3.2"
      - name: Verify unchanged archive and extract FIT only
        run: |
          gh release download finite-shot-cohort-20261025-1448ca1ebbdf \
            --repo kys928/TriQTO -D . \
            -p 'TriQTO_Finite_Shot_Cohort_20261025.tar.gz' -p 'SHA256SUMS'
          sha256sum -c SHA256SUMS
          tar -xzf TriQTO_Finite_Shot_Cohort_20261025.tar.gz --wildcards \
            'corpus/roots.json' \
            'corpus/blind/FIT/*.npz' \
            'corpus/derived/FIT/*.npz'
          test ! -e corpus/blind/TEST
          test ! -e corpus/blind/SELECTION
          test ! -e corpus/development_truth
          test ! -e corpus/sealed
      - name: Compare oracle-free K=1/2/4/8 calibration centers
        run: |
          python scripts/cohort/pool_calibration_source_fit.py \
            --corpus corpus --output pooled-source-fit-analysis.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pooled-source-fit-analysis
          path: pooled-source-fit-analysis.json
          if-no-files-found: warn
          retention-days: 30
