name: TriQTO Calibration Count Substitution
on:
  push:
    branches: [main]
    paths: ['runpod/calibration-experiment/*.json']
permissions:
  contents: read
  packages: write
concurrency:
  group: triqto-calibration-substitution
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_S3_ENDPOINT: ${{ vars.RUNPOD_S3_ENDPOINT }}
      RUNPOD_ALLOWED_GPU_TYPES: ${{ vars.RUNPOD_ALLOWED_GPU_TYPES }}
      RUNPOD_CONTAINER_REGISTRY_AUTH_ID: ${{ vars.RUNPOD_CONTAINER_REGISTRY_AUTH_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet boto3 pytest numpy==2.3.2 pyyaml
      - name: Verify bundle validation before provisioning
        run: python -m pytest tests/test_portable_calibration.py tests/test_runpod_calibration_substitution.py -q
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build audit-only overlay on the frozen numerical image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/runpod-agent/Dockerfile.calibration
          push: true
          tags: ghcr.io/kys928/triqto-runpod:calibration-${{ github.sha }}
      - name: Run donor, recipient intervention, and CPU ablations
        env:
          CALIBRATION_IMAGE: ghcr.io/kys928/triqto-runpod@${{ steps.image.outputs.digest }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          paths=subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD','--','runpod/calibration-experiment/*.json'],text=True).splitlines()
          if len(paths)!=1: raise RuntimeError('Exactly one experiment request required')
          request=json.loads(Path(paths[0]).read_text())
          if set(request)!={'id'}: raise RuntimeError('Unexpected request fields')
          subprocess.run(['python','scripts/runpod_calibration_substitution.py','--experiment',request['id'],'--image',os.environ['CALIBRATION_IMAGE']],check=True)
          PY
      - name: Clean up any pod left after interruption
        if: always()
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import runpod_control_v2 as control
          path=Path('calibration_active_pod.json')
          if path.is_file(): control.delete_pod(json.loads(path.read_text())['pod_id'])
          PY
      - name: Preserve verified experimental results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibration-substitution-results
          path: calibration_*_result.json
          if-no-files-found: ignore
      - name: Preserve concise comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibration-substitution-summary
          path: calibration_experiment_summary.json
          if-no-files-found: ignore
