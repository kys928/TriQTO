name: TriQTO Historical Phase-A Runtime Provenance (Read Only)
on:
  push:
    branches: [main]
    paths: ["runpod/phasea-history/*.json"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_S3_ENDPOINT: ${{ vars.RUNPOD_S3_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet boto3
      - name: Inspect single historical Phase-A record with S3 GET only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          import boto3
          from botocore.config import Config
          from botocore.exceptions import ClientError
          requests=subprocess.check_output(["git","diff","--name-only","HEAD^","HEAD","--","runpod/phasea-history/*.json"],text=True).splitlines()
          if len(requests)!=1: raise RuntimeError("expected exactly one historical inspection request")
          req=json.loads(Path(requests[0]).read_text())
          expected={"id","job_id","control_run_id"}
          if set(req)!=expected: raise RuntimeError("unexpected request keys")
          if req["job_id"]!="step14-equivalence-aware-fresh-holdout-predict-20260913-retry2":
              raise RuntimeError("only original completed Phase A allowed")
          if req["control_run_id"]!="run-1789316359-1846431f":
              raise RuntimeError("unexpected historical run")
          base=f'triqto-control/runs/{req["job_id"]}/{req["control_run_id"]}'
          s3=boto3.client(
              "s3",endpoint_url=os.environ["RUNPOD_S3_ENDPOINT"],
              region_name=os.environ["RUNPOD_DATACENTER_ID"].lower(),
              aws_access_key_id=os.environ["RUNPOD_S3_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["RUNPOD_S3_SECRET_ACCESS_KEY"],
              config=Config(signature_version="s3v4"))
          bucket=os.environ["RUNPOD_NETWORK_VOLUME_ID"]
          def fetch(key):
              try:return s3.get_object(Bucket=bucket,Key=key)["Body"].read()
              except ClientError as exc:
                  if str(exc.response.get("Error",{}).get("Code")) in {"NoSuchKey","404"}:return None
                  raise
          keys=[
              f"{base}/status.json",f"{base}/job.json",
              f"triqto-control/history/{req['control_run_id']}.json",
          ]
          data={}
          for key in keys:
              raw=fetch(key)
              if raw is None:
                  data[key]={"present":False}
                  continue
              j=json.loads(raw)
              keep={}
              for k in ("state","status","started_at","completed_at","completed_steps","returncode","gpu","provenance","job_id","control_run_id","runner","task","outcome","archived_at","image_name","pod_id","scientific_operation"):
                  if k in j:keep[k]=j[k]
              if "detail" in j:
                  d=j["detail"]
                  keep["detail_summary"]={
                      "status":(d.get("status") or {}).get("state"),
                      "gpu":(d.get("status") or {}).get("gpu"),
                      "provenance":(d.get("status") or {}).get("provenance"),
                  }
              data[key]={"present":True,"sha256":"sha256:"+hashlib.sha256(raw).hexdigest(),"metadata":keep}
          entries=s3.list_objects_v2(Bucket=bucket,Prefix=base+"/")
          files=[str(x["Key"]) for x in entries.get("Contents",[])]
          logs={}
          for name in files:
              if name.endswith(".log") and name.startswith(base+"/"):
                  raw=fetch(name)
                  logs[name]={"sha256":"sha256:"+hashlib.sha256(raw).hexdigest(),"size":len(raw),
                              "tail":raw.decode(errors="replace").splitlines()[-18:]}
          print(json.dumps({"job_id":req["job_id"],"control_run_id":req["control_run_id"],"historical_status":data,
              "log_paths":files,"log_summaries":logs,"read_only":True},indent=2,sort_keys=True))
          PY
