name: Read Step-15 Frozen Results

on:
  push:
    branches: [main]
    paths:
      - "runpod/step15-read/*.json"

permissions:
  contents: read

concurrency:
  group: triqto-step15-read-results
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_S3_ENDPOINT: ${{ vars.RUNPOD_S3_ENDPOINT }}

    steps:
      - name: Check out TriQTO
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install boto3
        run: python -m pip install --disable-pip-version-check boto3

      - name: Read and hash-verify requested Step-15 result
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$GITHUB_SHA^" "$GITHUB_SHA" -- 'runpod/step15-read/*.json' > /tmp/step15-read-requests.txt
          while IFS= read -r request; do
            [[ -z "$request" ]] && continue
            python - "$request" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import sys
          import boto3
          from botocore.config import Config

          request_path = Path(sys.argv[1])
          req = json.loads(request_path.read_text(encoding="utf-8"))
          if set(req) - {"id", "phase", "status_key", "log_key"}:
              raise SystemExit("unsupported request keys")
          phase = str(req.get("phase", ""))
          if phase not in {"fit", "audit", "status"}:
              raise SystemExit("phase must be fit, audit, or status")

          datacenter = os.environ["RUNPOD_DATACENTER_ID"].strip()
          endpoint = os.environ.get("RUNPOD_S3_ENDPOINT", "").strip() or f"https://s3api-{datacenter.lower()}.runpod.io/"
          client = boto3.client(
              "s3",
              endpoint_url=endpoint,
              region_name=datacenter.lower(),
              aws_access_key_id=os.environ["RUNPOD_S3_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["RUNPOD_S3_SECRET_ACCESS_KEY"],
              config=Config(signature_version="s3v4", retries={"max_attempts": 10, "mode": "standard"}),
          )
          bucket = os.environ["RUNPOD_NETWORK_VOLUME_ID"].strip()

          def get_bytes(key: str) -> bytes:
              return client.get_object(Bucket=bucket, Key=key)["Body"].read()

          def get_json(key: str):
              return json.loads(get_bytes(key).decode("utf-8"))

          def sha(raw: bytes) -> str:
              return "sha256:" + hashlib.sha256(raw).hexdigest()

          def volume_key(path: str) -> str:
              text = path.strip()
              if text.startswith("/workspace/"):
                  text = text[len("/workspace/"):]
              text = text.lstrip("/")
              p = PurePosixPath(text)
              if not text or ".." in p.parts:
                  raise RuntimeError("unsafe volume path")
              return p.as_posix()

          if phase == "status":
              status_key = str(req.get("status_key", ""))
              log_key = str(req.get("log_key", ""))
              allowed_prefix = "triqto-control/runs/step15-"
              if not status_key.startswith(allowed_prefix) or not status_key.endswith("/status.json"):
                  raise SystemExit("unsafe Step-15 status_key")
              if log_key and (not log_key.startswith(allowed_prefix) or not log_key.endswith(".log")):
                  raise SystemExit("unsafe Step-15 log_key")
              status = get_json(status_key)
              output = {"request_id": req.get("id"), "phase": phase, "status_key": status_key, "status": status}
              if log_key:
                  raw_log = get_bytes(log_key)
                  output["log_key"] = log_key
                  output["log_size_bytes"] = len(raw_log)
                  output["log_tail"] = raw_log[-30000:].decode("utf-8", errors="replace")
              print(json.dumps(output, indent=2, sort_keys=True))
              raise SystemExit(0)

          if phase == "fit":
              pointer_key = "triqto-data/step15_frame_ranking/current_step15_frame_ranker.json"
              pointer = get_json(pointer_key)
              base = volume_key(str(pointer["method_dir"]))
              checks = {
                  "frame_rank_adapter.json": str(pointer["adapter_sha256"]),
                  "fit_development_result.json": str(pointer["fit_development_result_sha256"]),
                  "adapter_freeze.json": str(pointer["adapter_freeze_sha256"]),
                  "step15_complete.json": str(pointer["step15_complete_sha256"]),
              }
          else:
              pointer_key = "triqto-data/step15_spent_holdout_audit/current_step15_spent_holdout_audit.json"
              pointer = get_json(pointer_key)
              base = volume_key(str(pointer["audit_dir"]))
              checks = {
                  "spent_holdout_audit_result.json": str(pointer["spent_holdout_audit_result_sha256"]),
                  "per_example_spent_holdout_audit.csv": str(pointer["per_example_spent_holdout_audit_sha256"]),
                  "spent_holdout_audit_complete.json": str(pointer["spent_holdout_audit_complete_sha256"]),
              }

          verified = {}
          rendered = {}
          for name, expected in checks.items():
              raw = get_bytes(f"{base}/{name}")
              got = sha(raw)
              if got != expected:
                  raise RuntimeError(f"hash mismatch for {name}: {got} != {expected}")
              verified[name] = got
              if name.endswith(".json"):
                  rendered[name] = json.loads(raw.decode("utf-8"))

          print(json.dumps({
              "request_id": req.get("id"),
              "phase": phase,
              "pointer_key": pointer_key,
              "pointer": pointer,
              "verified_sha256": verified,
              "json_artifacts": rendered,
          }, indent=2, sort_keys=True))
          PY
          done < /tmp/step15-read-requests.txt
