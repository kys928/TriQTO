name: Build TriQTO RunPod Agent Image

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-runpod-agent.yml"
      - "docker/runpod-agent/**"
      - "docker/phase15_6/**"
      - "scripts/runpod_worker.py"
      - "scripts/runpod_step14_training_worker.py"
      - "scripts/run_phase15_6_campaign.py"
      - "scripts/v0_2/evaluate_step14_pretraining_baseline.py"
      - "scripts/v0_2/run_step14_cross_motif_training.py"
      - "scripts/v0_2/analyze_step14_oracle_raw_evidence_ceiling.py"
      - "scripts/v0_2/run_step14_oracle_raw_evidence_ceiling.py"
      - "src/**"
      - "configs/**"
      - "requirements*.txt"
      - "constraints/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: triqto-runpod-agent-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out TriQTO
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push RunPod worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/runpod-agent/Dockerfile
          push: true
          tags: |
            ghcr.io/kys928/triqto-runpod:latest
            ghcr.io/kys928/triqto-runpod:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
