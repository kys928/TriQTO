name: TriQTO Step 15 Frame Ranking

on:
  push:
    branches: [main]
    paths:
      - "runpod/step15/*.json"
  workflow_dispatch:
    inputs:
      request_path:
        description: "Path to one immutable Step-15 RunPod request"
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: triqto-step15-frame-ranking
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_S3_ENDPOINT: ${{ vars.RUNPOD_S3_ENDPOINT }}
      RUNPOD_ALLOWED_GPU_TYPES: ${{ vars.RUNPOD_ALLOWED_GPU_TYPES }}
      RUNPOD_CONTAINER_REGISTRY_AUTH_ID: ${{ vars.RUNPOD_CONTAINER_REGISTRY_AUTH_ID }}
      MANUAL_REQUEST_PATH: ${{ inputs.request_path }}

    steps:
      - name: Check out TriQTO
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install control-plane dependency
        run: python -m pip install --disable-pip-version-check boto3

      - name: Determine Step-15 requests
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/step15-requests.txt
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            printf '%s\n' "$MANUAL_REQUEST_PATH" > /tmp/step15-requests.txt
          else
            git diff --name-only "$GITHUB_SHA^" "$GITHUB_SHA" -- 'runpod/step15/*.json' > /tmp/step15-requests.txt
          fi
          if [[ ! -s /tmp/step15-requests.txt ]]; then
            echo "No Step-15 requests found."
          else
            echo "Step-15 requests:"
            cat /tmp/step15-requests.txt
          fi

      - name: Launch pinned Step-15 operation
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r request; do
            [[ -z "$request" ]] && continue
            if [[ ! "$request" =~ ^runpod/step15/[A-Za-z0-9._-]+\.json$ ]]; then
              echo "Unsafe Step-15 request path: $request" >&2
              exit 2
            fi
            if [[ ! -f "$request" ]]; then
              echo "Skipping removed Step-15 request: $request"
              continue
            fi

            launched=false
            for attempt in $(seq 1 20); do
              set +e
              output="$(python scripts/runpod_step15_frame_ranking.py --request "$request" 2>&1)"
              rc=$?
              set -e
              printf '%s\n' "$output"
              if [[ "$rc" -eq 0 ]]; then
                launched=true
                break
              fi
              if grep -Fq "There are no instances currently available" <<<"$output"; then
                echo "RunPod capacity unavailable (attempt $attempt/20); retrying in 30 seconds."
                sleep 30
                continue
              fi
              exit "$rc"
            done
            if [[ "$launched" != true ]]; then
              echo "RunPod capacity remained unavailable after 20 attempts." >&2
              exit 1
            fi
          done < /tmp/step15-requests.txt

      - name: Start continuous RunPod supervisor
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run runpod-supervisor.yml --ref main
          echo "Supervisor dispatch accepted for Step-15 frame ranking."
