name: TriQTO FIT-only posterior mechanism inference marginalization
on:
  push:
    branches: [research/inference-marginalization-fit-20261025]
    paths: ['.github/workflows/triqto-inference-marginalization-fit.yml']
permissions:
  contents: read
jobs:
  uncertainty-mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet numpy==2.3.2 pytest==8.4.2
      - run: python -m pytest -q tests/test_inference_uncertainty_marginalization.py
  fit-posterior-grid:
    needs: uncertainty-mechanics
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {start: 40, stop: 48}
          - {start: 48, stop: 56}
          - {start: 56, stop: 64}
          - {start: 64, stop: 72}
    env:
      GH_TOKEN: ${{ github.token }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_S3_ENDPOINT: ${{ vars.RUNPOD_S3_ENDPOINT }}
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact cohort/numerical dependencies and frozen CPU PyTorch
        run: |
          python -m pip install --quiet -r requirements-cohort.txt
          python -m pip install --quiet "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
      - name: Verify original cohort hash and unpack FIT only
        run: |
          gh release download finite-shot-cohort-20261025-1448ca1ebbdf --repo kys928/TriQTO -D . \
            -p 'TriQTO_Finite_Shot_Cohort_20261025.tar.gz' -p 'SHA256SUMS'
          sha256sum -c SHA256SUMS
          tar -xzf TriQTO_Finite_Shot_Cohort_20261025.tar.gz --wildcards \
            'corpus/roots.json' 'corpus/blind/FIT/*.npz' 'corpus/development_truth/FIT/*.json'
          test ! -e corpus/blind/SELECTION
          test ! -e corpus/blind/TEST
          test ! -e corpus/development_truth/SELECTION
          test ! -e corpus/sealed
      - name: One-acquisition inference marginalization against frozen R0 (FIT only)
        run: |
          python scripts/cohort/fit_inference_marginalization_shard.py \
            --corpus corpus --start ${{ matrix.start }} --stop ${{ matrix.stop }} \
            --output posterior-fit-${{ matrix.start }}-${{ matrix.stop }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: posterior-fit-shard-${{ matrix.start }}-${{ matrix.stop }}
          path: posterior-fit-${{ matrix.start }}-${{ matrix.stop }}.json
          retention-days: 30
  family-disjoint-screen:
    needs: fit-posterior-grid
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet numpy==2.3.2
      - name: Download only all four prospective FIT shards from this run
        run: |
          mkdir -p fit-shards
          gh run download ${{ github.run_id }} --repo kys928/TriQTO \
            --pattern 'posterior-fit-shard-*' --dir fit-shards
          test $(find fit-shards -name 'posterior-fit-*.json' | wc -l) -eq 4
      - name: Predeclared FIT 16-family tuning and 16-family independent screen
        run: |
          python scripts/cohort/reduce_fit_inference_marginalization.py \
            --input-directory fit-shards --output fit-posterior-marginalization-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: fit-posterior-marginalization-screen
          path: fit-posterior-marginalization-report.json
          retention-days: 30
