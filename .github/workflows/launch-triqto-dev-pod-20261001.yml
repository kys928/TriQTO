name: Launch TriQTO Dev Pod 2026-10-01

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/launch-triqto-dev-pod-20261001.yml"

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_ALLOWED_GPU_TYPES: ${{ vars.RUNPOD_ALLOWED_GPU_TYPES }}
      RUNPOD_IMAGE_NAME: ${{ vars.RUNPOD_IMAGE_NAME }}
      RUNPOD_CONTAINER_REGISTRY_AUTH_ID: ${{ vars.RUNPOD_CONTAINER_REGISTRY_AUTH_ID }}

    steps:
      - name: Launch cheapest available allowed TriQTO GPU pod
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          api_key = os.environ["RUNPOD_API_KEY"].strip()
          volume_id = os.environ["RUNPOD_NETWORK_VOLUME_ID"].strip()
          datacenter = os.environ["RUNPOD_DATACENTER_ID"].strip()
          image = os.environ["RUNPOD_IMAGE_NAME"].strip()
          registry_auth = os.environ.get("RUNPOD_CONTAINER_REGISTRY_AUTH_ID", "").strip()
          allowed = {x.strip() for x in os.environ["RUNPOD_ALLOWED_GPU_TYPES"].split(",") if x.strip()}

          # Cheapest-first among the TriQTO allow-listed GPUs. A failed capacity
          # allocation falls through to the next type automatically.
          preferred = [
              "NVIDIA GeForce RTX 3090",
              "NVIDIA GeForce RTX 4090",
              "NVIDIA GeForce RTX 5090",
          ]
          candidates = [gpu for gpu in preferred if gpu in allowed]
          if not candidates:
              raise SystemExit(f"No preferred GPU is in RUNPOD_ALLOWED_GPU_TYPES: {sorted(allowed)}")

          headers = {
              "Authorization": f"Bearer {api_key}",
              "Accept": "application/json",
              "Content-Type": "application/json",
              "User-Agent": "TriQTO-GitHub-DevPod/1",
          }

          errors = []
          for gpu in candidates:
              payload = {
                  "name": "triqto-dev-20261001",
                  "computeType": "GPU",
                  "cloudType": "SECURE",
                  "gpuTypeIds": [gpu],
                  "gpuTypePriority": "availability",
                  "gpuCount": 1,
                  "dataCenterIds": [datacenter],
                  "dataCenterPriority": "availability",
                  "networkVolumeId": volume_id,
                  "volumeMountPath": "/workspace",
                  "containerDiskInGb": 50,
                  "dockerEntrypoint": ["/bin/bash", "-lc"],
                  "dockerStartCmd": ["cd /opt/TriQTO && echo 'TriQTO dev pod ready' && exec tail -f /dev/null"],
                  "ports": [],
                  "env": {"PYTHONUNBUFFERED": "1"},
                  "interruptible": False,
                  "imageName": image,
              }
              if registry_auth:
                  payload["containerRegistryAuthId"] = registry_auth

              req = urllib.request.Request(
                  "https://rest.runpod.io/v1/pods",
                  data=json.dumps(payload).encode("utf-8"),
                  headers=headers,
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      pod = json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  errors.append({"gpu": gpu, "http": exc.code, "detail": detail[:1000]})
                  print(json.dumps({"gpu_attempt_failed": gpu, "http": exc.code, "detail": detail[:500]}))
                  continue

              pod_id = pod.get("id")
              if not pod_id:
                  errors.append({"gpu": gpu, "detail": f"missing pod id: {pod!r}"})
                  continue
              cost = pod.get("adjustedCostPerHr", pod.get("costPerHr"))
              result = {
                  "launched": True,
                  "pod_id": str(pod_id),
                  "gpu_requested": gpu,
                  "cost_per_hour_usd": cost,
                  "datacenter": datacenter,
                  "network_volume_id": volume_id,
                  "name": pod.get("name", "triqto-dev-20261001"),
                  "desired_status": pod.get("desiredStatus"),
                  "created_at": datetime.now(timezone.utc).isoformat(),
              }
              print("TRIQTO_DEV_POD_RESULT=" + json.dumps(result, sort_keys=True))
              with open("/tmp/triqto-dev-pod.json", "w", encoding="utf-8") as f:
                  json.dump(result, f, indent=2, sort_keys=True)
                  f.write("\n")
              break
          else:
              raise SystemExit("No allowed GPU could be provisioned: " + json.dumps(errors))
          PY

      - name: Show launch result
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/triqto-dev-pod.json ]]; then
            cat /tmp/triqto-dev-pod.json
          fi
