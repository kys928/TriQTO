name: Archive Portable Calibration Evidence
on:
  push:
    branches: [main]
    paths: ['runpod/calibration-archive/*.json']
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_S3_ENDPOINT: ${{ vars.RUNPOD_S3_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet boto3 numpy==2.3.2
      - name: Export and verify the fixed experiment and selected blind inputs
        run: python scripts/archive_calibration_evidence.py --output calibration-evidence
      - name: Archive outside Runpod and expiring Actions storage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=calibration-evidence-20261019
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Refusing to overwrite an existing evidence release'
            exit 1
          fi
          gh release create "$tag" calibration-evidence.tar.gz calibration-evidence.tar.sha256.json --target "$GITHUB_SHA" --title 'Verified calibration replay evidence, 2026-10-19' --notes 'Raw captured probabilities and sampled counts with provenance, selected blind inputs, and frozen checkpoints. Fixed targeted replay cohort; no sealed truth or full holdout scoring.'
          mkdir verify-download
          gh release download "$tag" --dir verify-download
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          rec=json.loads(Path('verify-download/calibration-evidence.tar.sha256.json').read_text())
          assert 'sha256:'+hashlib.sha256(Path('verify-download/calibration-evidence.tar.gz').read_bytes()).hexdigest()==rec['archive_sha256']
          print('Independent release download SHA256 verified:', rec['archive_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: portable-calibration-evidence
          path: |
            calibration-evidence.tar.gz
            calibration-evidence.tar.sha256.json
