name: TriQTO FIT family crossfit covariance calibration
on:
  push:
    branches: [research/stabilization-gates-20261025]
    paths: ['.github/workflows/triqto-fit-covariance-crossfit.yml']
permissions:
  contents: read
jobs:
  family-crossfit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install minimum dependencies
        run: python -m pip install --quiet "numpy==2.3.2" "pytest==8.4.2"
      - name: Test the frozen FIT crossfit mechanics
        run: python -m pytest -q tests/test_fit_covariance_crossfit.py
      - name: Verify original archive hash and extract permitted FIT counts only
        run: |
          gh release download finite-shot-cohort-20261025-1448ca1ebbdf --repo kys928/TriQTO \
            -D . -p 'TriQTO_Finite_Shot_Cohort_20261025.tar.gz' -p 'SHA256SUMS'
          sha256sum -c SHA256SUMS
          tar -xzf TriQTO_Finite_Shot_Cohort_20261025.tar.gz --wildcards \
            'corpus/roots.json' \
            'corpus/blind/FIT/*.npz' \
            'corpus/derived/FIT/*.npz'
          test ! -e corpus/blind/SELECTION
          test ! -e corpus/blind/TEST
          test ! -e corpus/sealed
          test ! -e corpus/development_truth
      - name: 5-fold family-heldout covariance calibration
        run: |
          python scripts/cohort/crossfit_nonlinear_covariance_fit.py \
            --corpus corpus --output covariance-crossfit-fit-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: five-fold-fit-covariance-calibration
          path: covariance-crossfit-fit-results.json
          if-no-files-found: warn
          retention-days: 30
