name: RunPod S3 Step-14 Read

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/runpod-s3-read-step14.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  read-step14:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_S3_ENDPOINT: ${{ vars.RUNPOD_S3_ENDPOINT }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install boto3
        run: python -m pip install --quiet boto3

      - name: Read frozen Step-14 training artifacts directly from S3
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import boto3
          from botocore.config import Config

          bucket = os.environ['RUNPOD_NETWORK_VOLUME_ID']
          endpoint = os.environ['RUNPOD_S3_ENDPOINT']
          region = os.environ['RUNPOD_DATACENTER_ID'].lower()
          client = boto3.client(
              's3',
              endpoint_url=endpoint,
              region_name=region,
              aws_access_key_id=os.environ['RUNPOD_S3_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['RUNPOD_S3_SECRET_ACCESS_KEY'],
              config=Config(signature_version='s3v4', retries={'max_attempts': 8, 'mode': 'standard'}),
          )

          def read_text(key: str) -> str:
              obj = client.get_object(Bucket=bucket, Key=key)
              return obj['Body'].read().decode('utf-8')

          root = 'triqto-data/step14_cross_motif_training'
          pointer_text = read_text(f'{root}/current_training_run.json')
          pointer = json.loads(pointer_text)
          run_dir = str(pointer['run_dir'])
          workspace_prefix = '/workspace/'
          if not run_dir.startswith(workspace_prefix):
              raise RuntimeError(f'Unexpected run_dir: {run_dir!r}')
          run_key = run_dir[len(workspace_prefix):].rstrip('/')
          if not run_key.startswith(root + '/training_'):
              raise RuntimeError(f'Refusing unexpected Step-14 run key: {run_key!r}')

          output = 'runpod/step14_training/latest_s3_read'
          os.makedirs(output, exist_ok=True)
          with open(f'{output}/current_training_run.json', 'w', encoding='utf-8') as f:
              f.write(pointer_text)

          names = ['selection_freeze.json', 'training_history.json', 'training_complete.json']
          print('=== current_training_run.json ===')
          print(pointer_text)
          for name in names:
              text = read_text(f'{run_key}/{name}')
              json.loads(text)
              with open(f'{output}/{name}', 'w', encoding='utf-8') as f:
                  f.write(text)
              print(f'=== {name} ===')
              print(text)
          PY

      - name: Commit read-only snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runpod/step14_training/latest_s3_read/*.json
          if git diff --cached --quiet; then
            echo "Step-14 S3 snapshot unchanged."
            exit 0
          fi
          git commit -m "Snapshot Step-14 training artifacts from RunPod S3"
          git push

      - name: Upload Step-14 S3 read
        uses: actions/upload-artifact@v4
        with:
          name: step14-s3-read
          path: runpod/step14_training/latest_s3_read/*.json
          retention-days: 3
