name: RunPod S3 Step-14 Read

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/runpod-s3-read-step14.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  read-step14:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_S3_ENDPOINT: ${{ vars.RUNPOD_S3_ENDPOINT }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install boto3
        run: python -m pip install --quiet boto3

      - name: Read Step-14 training, diagnostics, and worker artifacts directly from S3
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import boto3
          from botocore.config import Config
          from botocore.exceptions import ClientError

          CONTROL_RUN_ID = 'run-1788535566-c5833396'
          bucket = os.environ['RUNPOD_NETWORK_VOLUME_ID']
          endpoint = os.environ['RUNPOD_S3_ENDPOINT']
          region = os.environ['RUNPOD_DATACENTER_ID'].lower()
          client = boto3.client(
              's3', endpoint_url=endpoint, region_name=region,
              aws_access_key_id=os.environ['RUNPOD_S3_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['RUNPOD_S3_SECRET_ACCESS_KEY'],
              config=Config(signature_version='s3v4', retries={'max_attempts': 8, 'mode': 'standard'}),
          )

          def read_text(key):
              return client.get_object(Bucket=bucket, Key=key)['Body'].read().decode('utf-8')

          def try_read_text(key):
              try:
                  return read_text(key)
              except ClientError as exc:
                  code = str(exc.response.get('Error', {}).get('Code', ''))
                  if code in {'NoSuchKey', '404'}:
                      return None
                  raise

          output = 'runpod/step14_training/latest_s3_read'
          os.makedirs(output, exist_ok=True)

          root = 'triqto-data/step14_cross_motif_training'
          pointer_text = read_text(f'{root}/current_training_run.json')
          pointer = json.loads(pointer_text)
          run_dir = str(pointer['run_dir'])
          if not run_dir.startswith('/workspace/'):
              raise RuntimeError(f'Unexpected run_dir: {run_dir!r}')
          run_key = run_dir[len('/workspace/'):].rstrip('/')
          if not run_key.startswith(root + '/training_'):
              raise RuntimeError(f'Refusing unexpected Step-14 run key: {run_key!r}')

          with open(f'{output}/current_training_run.json', 'w', encoding='utf-8') as f:
              f.write(pointer_text)
          for name in ['selection_freeze.json', 'training_history.json', 'training_complete.json']:
              text = read_text(f'{run_key}/{name}')
              json.loads(text)
              with open(f'{output}/{name}', 'w', encoding='utf-8') as f:
                  f.write(text)

          latent_root = 'triqto-data/step14_latent_frame_inference'
          latent_pointer_text = read_text(f'{latent_root}/current_latent_frame_inference.json')
          latent_pointer = json.loads(latent_pointer_text)
          diagnostic_dir = str(latent_pointer['diagnostic_dir'])
          if not diagnostic_dir.startswith('/workspace/'):
              raise RuntimeError(f'Unexpected latent diagnostic_dir: {diagnostic_dir!r}')
          diagnostic_key = diagnostic_dir[len('/workspace/'):].rstrip('/')
          if not diagnostic_key.startswith(latent_root + '/latent_frame_'):
              raise RuntimeError(f'Refusing unexpected latent diagnostic key: {diagnostic_key!r}')

          with open(f'{output}/latent_current_latent_frame_inference.json', 'w', encoding='utf-8') as f:
              f.write(latent_pointer_text)
          for name in ['diagnostic_result.json', 'diagnostic_complete.json']:
              text = read_text(f'{diagnostic_key}/{name}')
              json.loads(text)
              with open(f'{output}/latent_{name}', 'w', encoding='utf-8') as f:
                  f.write(text)

          # Ambiguity output is optional while the worker is still active.
          ambiguity_root = 'triqto-data/step14_candidate_frame_ambiguity'
          ambiguity_pointer_text = try_read_text(f'{ambiguity_root}/current_candidate_frame_ambiguity.json')
          if ambiguity_pointer_text is not None:
              ambiguity_pointer = json.loads(ambiguity_pointer_text)
              ambiguity_dir = str(ambiguity_pointer['diagnostic_dir'])
              if not ambiguity_dir.startswith('/workspace/'):
                  raise RuntimeError(f'Unexpected ambiguity diagnostic_dir: {ambiguity_dir!r}')
              ambiguity_key = ambiguity_dir[len('/workspace/'):].rstrip('/')
              if not ambiguity_key.startswith(ambiguity_root + '/frame_ambiguity_'):
                  raise RuntimeError(f'Refusing unexpected ambiguity diagnostic key: {ambiguity_key!r}')
              with open(f'{output}/ambiguity_current_candidate_frame_ambiguity.json', 'w', encoding='utf-8') as f:
                  f.write(ambiguity_pointer_text)
              for name in ['diagnostic_result.json', 'diagnostic_complete.json']:
                  text = read_text(f'{ambiguity_key}/{name}')
                  json.loads(text)
                  with open(f'{output}/ambiguity_{name}', 'w', encoding='utf-8') as f:
                      f.write(text)
                  print(f'=== ambiguity {name} ===')
                  print(text)
          else:
              print('=== ambiguity diagnostic ===')
              print('not complete yet; pointer is absent')

          paginator = client.get_paginator('list_objects_v2')
          suffix = f'/{CONTROL_RUN_ID}/status.json'
          matches = []
          for page in paginator.paginate(Bucket=bucket, Prefix='triqto-control/runs/'):
              for obj in page.get('Contents', []):
                  key = obj['Key']
                  if key.endswith(suffix):
                      matches.append(key)
          if len(matches) != 1:
              raise RuntimeError(f'Expected exactly one worker status for {CONTROL_RUN_ID}, found {matches}')

          status_key = matches[0]
          control_prefix = status_key[:-len('status.json')]
          for name in ['status.json', 'job.json', 'worker.log']:
              text = read_text(control_prefix + name)
              if name.endswith('.json'):
                  json.loads(text)
              with open(f'{output}/worker_{name}', 'w', encoding='utf-8') as f:
                  f.write(text)
              print(f'=== {name} ===')
              print(text)

          history_key = f'triqto-control/history/{CONTROL_RUN_ID}.json'
          history_text = try_read_text(history_key)
          if history_text is not None:
              json.loads(history_text)
              with open(f'{output}/worker_history.json', 'w', encoding='utf-8') as f:
                  f.write(history_text)
              print('=== history ===')
              print(history_text)
          else:
              print('=== history ===')
              print('not yet archived; worker is still active')
          PY

      - name: Commit read-only snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runpod/step14_training/latest_s3_read/
          if git diff --cached --quiet; then
            echo "Step-14 S3 snapshot unchanged."
            exit 0
          fi
          git commit -m "Snapshot Step-14 training and worker artifacts from RunPod S3"
          git push

      - name: Upload Step-14 S3 read
        uses: actions/upload-artifact@v4
        with:
          name: step14-s3-read
          path: runpod/step14_training/latest_s3_read/*
          retention-days: 3
