name: TriQTO cohort additional blind historical identities
on:
  push:
    branches: [research/finite-shot-cohort-20261025]
    paths: ['.github/workflows/triqto-cohort-additional-identities.yml']
permissions:
  contents: read
jobs:
  identity-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_S3_ENDPOINT: ${{ vars.RUNPOD_S3_ENDPOINT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet boto3
      - run: python scripts/cohort/extend_exclusions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: additional-exclusions
          path: additional-exclusions.json
          if-no-files-found: warn
          retention-days: 30
