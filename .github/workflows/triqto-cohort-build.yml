name: TriQTO independent finite-shot cohort construction
on:
  push:
    branches: [research/finite-shot-cohort-20261025]
    paths: ['.github/workflows/triqto-cohort-build.yml']
permissions:
  contents: write
jobs:
  construct-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet -r requirements-cohort.txt
      - name: Regression checks
        run: python -m pytest -q tests/test_independent_cohort.py
      - name: Read-only historical exclusions
        env:
          RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
          RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
          RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
          RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
          RUNPOD_S3_ENDPOINT: ${{ vars.RUNPOD_S3_ENDPOINT }}
        run: python scripts/cohort/s3_exclusion_inventory.py
      - name: Engineering pipeline pilot before full acquisition
        run: |
          python scripts/cohort/build.py --pilot --exclusions historical-exclusions.json --output pilot
          python scripts/cohort/audit.py --product pilot --output pilot-audit.json
      - name: Construct quarantined scientific corpus
        run: |
          python scripts/cohort/build.py --exclusions historical-exclusions.json --public-key docs/evidence/finite_shot_cohort/test_sealing_public_key.pem --output corpus
      - name: Independent blind integrity audit
        run: python scripts/cohort/audit.py --product corpus --output cohort-audit.json
      - name: Development-only EDA and exhaustive derived-recipe hash checks
        run: python scripts/cohort/eda.py --product corpus --output cohort-report
      - name: Versioned archive and checksums
        id: archive
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          m=json.loads(Path('corpus/DATASET_MANIFEST.json').read_text())
          tag='finite-shot-cohort-20261025-'+m['cohort_identity'].split(':')[1][:12]
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('tag='+tag+'\n')
          note='Constructed quarantined cohort: 240 families / 960 roots / 12,480 observations.\n\n'
          note+='Internal hash/count/reconstruction audit and development-only EDA completed. Historical exclusion coverage is incomplete; this is NOT approval for stabilization selection.\n\n'
          note+='Identity: `'+m['cohort_identity']+'`. TEST labels/recipes are encrypted; the private recovery key is not in the repository, archive or runner. No model inference, retraining, QPU use or pod.\n'
          Path('release-notes.md').write_text(note)
          PY
          tar -I 'gzip -1' -cf TriQTO_Finite_Shot_Cohort_20261025.tar.gz corpus
          sha256sum TriQTO_Finite_Shot_Cohort_20261025.tar.gz > SHA256SUMS
          cp corpus/DATASET_MANIFEST.json cohort-report/DATASET_MANIFEST.json
          cp corpus/FEASIBILITY.json cohort-report/FEASIBILITY.json
          cp cohort-audit.json cohort-report/cohort-audit.json
          cp pilot-audit.json cohort-report/pilot-audit.json
          cp SHA256SUMS cohort-report/SHA256SUMS
      - name: Publish explicitly authorized research archive (quarantined)
        env:
          GH_TOKEN: ${{ github.token }}
          COHORT_TAG: ${{ steps.archive.outputs.tag }}
        run: |
          gh release create "$COHORT_TAG" --target "$GITHUB_SHA" --title "TriQTO finite-shot cohort: quarantined construction, 2026-10-25" --notes-file release-notes.md TriQTO_Finite_Shot_Cohort_20261025.tar.gz SHA256SUMS cohort-report/DATASET_MANIFEST.json cohort-report/cohort-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cohort-scientific-report
          path: |
            cohort-report/
            pilot-audit.json
            cohort-audit.json
            historical-exclusions.json
          if-no-files-found: warn
          retention-days: 90
