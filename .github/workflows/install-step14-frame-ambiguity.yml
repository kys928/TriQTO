name: Install Step-14 Frame Ambiguity Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-step14-frame-ambiguity.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analyzer and restricted operation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip

          payload = Path('.github/bootstrap/step14_candidate_frame_ambiguity.py.gz.b64').read_text(encoding='utf-8').strip()
          Path('scripts/v0_2/analyze_step14_candidate_frame_ambiguity.py').write_bytes(
              gzip.decompress(base64.b64decode(payload))
          )

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise RuntimeError(f'missing patch anchor in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          for path in ['scripts/runpod_step14_training_worker.py', 'scripts/runpod_step14_training_selection.py']:
              for _ in range(2):
                  replace_once(
                      path,
                      '    "decompose_latent_frame_inference",\n}',
                      '    "decompose_latent_frame_inference",\n    "decompose_candidate_frame_ambiguity",\n}',
                  )

          replace_once(
              'scripts/runpod_step14_training_worker.py',
              '        elif operation == "decompose_local_frame_canonicalization":\n            script = REPO_ROOT / "scripts" / "v0_2" / "analyze_step14_local_frame_canonicalization.py"\n        else:\n            script = REPO_ROOT / "scripts" / "v0_2" / "analyze_step14_latent_frame_inference.py"',
              '        elif operation == "decompose_local_frame_canonicalization":\n            script = REPO_ROOT / "scripts" / "v0_2" / "analyze_step14_local_frame_canonicalization.py"\n        elif operation == "decompose_latent_frame_inference":\n            script = REPO_ROOT / "scripts" / "v0_2" / "analyze_step14_latent_frame_inference.py"\n        else:\n            script = REPO_ROOT / "scripts" / "v0_2" / "analyze_step14_candidate_frame_ambiguity.py"',
          )
          replace_once(
              'scripts/runpod_step14_training_selection.py',
              '        "decompose_latent_frame_inference": "step14-latent-frame-inference",\n    }',
              '        "decompose_latent_frame_inference": "step14-latent-frame-inference",\n        "decompose_candidate_frame_ambiguity": "step14-candidate-frame-ambiguity",\n    }',
          )
          PY

          python -m py_compile \
            scripts/v0_2/analyze_step14_candidate_frame_ambiguity.py \
            scripts/runpod_step14_training_worker.py \
            scripts/runpod_step14_training_selection.py
          python -m json.tool configs/v0_2/step14_candidate_frame_ambiguity_decomposition.json >/dev/null
          grep -n "decompose_candidate_frame_ambiguity" scripts/runpod_step14_training_worker.py scripts/runpod_step14_training_selection.py

      - name: Commit installed diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/v0_2/analyze_step14_candidate_frame_ambiguity.py \
                  scripts/runpod_step14_training_worker.py \
                  scripts/runpod_step14_training_selection.py
          if git diff --cached --quiet; then
            echo "No diagnostic installation changes."
            exit 0
          fi
          git commit -m "Add frozen Step-14 candidate-frame ambiguity diagnostic"
          git push
