name: Repair Step-14 Frame Ambiguity Support Bound

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-step14-frame-ambiguity.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reuse frozen 17-operation compatibility support bound
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/v0_2/analyze_step14_candidate_frame_ambiguity.py')
          text = path.read_text(encoding='utf-8')

          import_old = 'import analyze_step14_oracle_raw_evidence_ceiling as oracle\n'
          import_new = (
              'import analyze_step14_oracle_raw_evidence_ceiling as oracle\n'
              'import run_step14_oracle_raw_evidence_ceiling as oracle_compat\n'
          )
          if 'import run_step14_oracle_raw_evidence_ceiling as oracle_compat' not in text:
              if import_old not in text:
                  raise RuntimeError('missing oracle import anchor')
              text = text.replace(import_old, import_new, 1)

          main_old = 'def main() -> None:\n    args = parse_args()\n    cfg = load_config()\n'
          main_new = (
              'def main() -> None:\n'
              '    args = parse_args()\n'
              '    # Frozen Step-14 reference circuits legally contain up to 17 operations.\n'
              '    # Reuse the already-audited compatibility fix rather than widening the parser ad hoc.\n'
              '    oracle_compat.apply_frozen_support_bound()\n'
              '    cfg = load_config()\n'
          )
          if 'oracle_compat.apply_frozen_support_bound()' not in text:
              if main_old not in text:
                  raise RuntimeError('missing main support-bound anchor')
              text = text.replace(main_old, main_new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          python -m py_compile scripts/v0_2/analyze_step14_candidate_frame_ambiguity.py
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts/v0_2')
          import analyze_step14_candidate_frame_ambiguity as ambiguity
          ambiguity.oracle_compat.apply_frozen_support_bound()
          assert ambiguity.oracle.MAX_GATES == 17, ambiguity.oracle.MAX_GATES
          print('verified frozen Step-14 MAX_GATES support = 17')
          PY

      - name: Commit exact support-bound repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/v0_2/analyze_step14_candidate_frame_ambiguity.py
          if git diff --cached --quiet; then
            echo "No support-bound repair changes."
            exit 0
          fi
          git commit -m "Fix Step-14 ambiguity 17-operation support bound"
          git push
