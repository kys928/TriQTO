name: Read Step-14 Equivalence FIT Status

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/read-step14-equivalence-fit-20260910.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_S3_ENDPOINT: ${{ vars.RUNPOD_S3_ENDPOINT }}

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install boto3
        run: python -m pip install --quiet boto3

      - name: Read exact FIT worker and method bundle from S3
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          import boto3
          from botocore.config import Config
          from botocore.exceptions import ClientError

          CONTROL_RUN_ID = "run-1789028661-d972f979"
          JOB_ID = "step14-equivalence-aware-fit-20260907"
          bucket = os.environ["RUNPOD_NETWORK_VOLUME_ID"]
          endpoint = os.environ["RUNPOD_S3_ENDPOINT"]
          region = os.environ["RUNPOD_DATACENTER_ID"].lower()
          s3 = boto3.client(
              "s3", endpoint_url=endpoint, region_name=region,
              aws_access_key_id=os.environ["RUNPOD_S3_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["RUNPOD_S3_SECRET_ACCESS_KEY"],
              config=Config(signature_version="s3v4", retries={"max_attempts": 8, "mode": "standard"}),
          )

          def read(key):
              return s3.get_object(Bucket=bucket, Key=key)["Body"].read().decode("utf-8")

          def maybe(key):
              try:
                  return read(key)
              except ClientError as exc:
                  code = str(exc.response.get("Error", {}).get("Code", ""))
                  if code in {"NoSuchKey", "404"}:
                      return None
                  raise

          prefix = f"triqto-control/runs/{JOB_ID}/{CONTROL_RUN_ID}/"
          print("=== status.json ===")
          status_text = read(prefix + "status.json")
          status = json.loads(status_text)
          print(json.dumps(status, indent=2, sort_keys=True))

          print("=== worker.log tail ===")
          log = maybe(prefix + "worker.log") or ""
          lines = log.splitlines()
          print("\n".join(lines[-250:]))

          history = maybe(f"triqto-control/history/{CONTROL_RUN_ID}.json")
          print("=== history ===")
          print(history if history is not None else "ABSENT")

          root = "triqto-data/step14_equivalence_aware_development"
          pointer_text = maybe(f"{root}/current_equivalence_aware_fit.json")
          print("=== current_equivalence_aware_fit.json ===")
          print(pointer_text if pointer_text is not None else "ABSENT")
          if pointer_text is None:
              raise SystemExit(0)

          pointer = json.loads(pointer_text)
          method_dir = str(pointer["method_dir"])
          if not method_dir.startswith("/workspace/"):
              raise RuntimeError(f"Unexpected method_dir: {method_dir!r}")
          method_key = method_dir[len("/workspace/"):].rstrip("/")
          if not method_key.startswith(root + "/equiv_fit_"):
              raise RuntimeError(f"Unexpected method key: {method_key!r}")

          for name in ["fit_complete.json", "method_bundle.json", "fit_development_result.json"]:
              text = read(f"{method_key}/{name}")
              json.loads(text)
              print(f"=== {name} ===")
              print(text)
          PY
