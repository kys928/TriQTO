name: Read Calibration Experiment Progress
on:
  push:
    branches: [main]
    paths: ['runpod/calibration-progress/*.json']
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_S3_ENDPOINT: ${{ vars.RUNPOD_S3_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet boto3
      - name: Read only scoped experiment progress, logs, and pod status
        run: |
          python - <<'PY'
          import json, subprocess, sys, os, time, socket
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import runpod_control_v2 as control
          import runpod_worker as common
          paths=subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD','--','runpod/calibration-progress/*.json'],text=True).splitlines()
          if len(paths)!=1: raise RuntimeError('one progress request required')
          req=json.loads(Path(paths[0]).read_text())
          if set(req)!={'experiment','id'}: raise RuntimeError('unexpected request fields')
          experiment=common.safe_job_id(req['experiment'])
          for role in ('capture','probe'):
              prefix='triqto-data/calibration_substitution/'+experiment+'/'+role+'/'
              progress=control.read_json_object(prefix+'progress.json')
              print(json.dumps({'role':role,'progress':progress}),flush=True)
              for profile in ('native','single_thread','haswell_single_thread','numpy_no_avx512_single_thread','substituted'):
                  try:
                      raw=control.s3_client().get_object(Bucket=control.bucket(),Key=prefix+profile+'.log')['Body'].read()
                  except control.ClientError as exc:
                      if str(exc.response['Error']['Code']) in {'NoSuchKey','404'}: continue
                      raise
                  print(json.dumps({'role':role,'profile':profile,'log_tail':raw.decode('utf-8',errors='replace').splitlines()[-8:]}),flush=True)
              records=control.list_json_objects(control.ACTIVE_PREFIX)+control.list_json_objects(control.HISTORY_PREFIX)
              for key, record in records:
                  if record.get('job_id')!=experiment+'-'+role: continue
                  status=control.read_json_object(record['status_key'])
                  print(json.dumps({'role':role,'record_key':key,'status':status}),flush=True)
                  try:
                      pod=control.runpod_request('GET','/pods/'+record['pod_id'])
                      view={k:pod.get(k) for k in ('id','desiredStatus','imageName','costPerHr','adjustedCostPerHr','lastStatusChange')}
                      print(json.dumps({'role':role,'pod':view}),flush=True)
                  except RuntimeError as exc:
                      if 'HTTP 404' not in str(exc): raise
                      print(json.dumps({'role':role,'pod_absent':True}),flush=True)
                  try:
                      request=Request('https://api.runpod.io/v2/pods/'+record['pod_id']+'/logs?tail=40',headers={'Authorization':'Bearer '+os.environ['RUNPOD_API_KEY'],'Accept':'text/event-stream'})
                      with urlopen(request,timeout=8) as response:
                          deadline=time.monotonic()+5
                          while time.monotonic()<deadline:
                              line=response.readline()
                              if not line: break
                              if line.startswith(b'data:'):
                                  print(json.dumps({'role':role,'pod_log':line[5:].decode('utf-8',errors='replace').strip()}),flush=True)
                  except (TimeoutError,socket.timeout): pass
                  except HTTPError as exc:
                      print(json.dumps({'role':role,'pod_log_http_status':exc.code}),flush=True)
          PY
