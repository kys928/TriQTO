name: TriQTO identity-only fresh I2 SELECTION proposal — excludes reserved TEST
on:
  push:
    branches: [research/inference-marginalization-fit-20261025]
    paths: ['.github/workflows/triqto-fresh-i2-selection-identities.yml']
permissions:
  contents: read
jobs:
  new-independent-selection-identities:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install frozen source-grammar dependencies only
        run: python -m pip install --quiet -r requirements-cohort.txt
      - name: Verify exact immutable prior cohort, extract STRUCTURE ONLY
        run: |
          gh release download finite-shot-cohort-20261025-1448ca1ebbdf \
            --repo kys928/TriQTO -D . \
            -p 'TriQTO_Finite_Shot_Cohort_20261025.tar.gz' -p 'SHA256SUMS'
          sha256sum -c SHA256SUMS
          tar -xzf TriQTO_Finite_Shot_Cohort_20261025.tar.gz \
            'corpus/roots.json' 'corpus/families.json'
          test ! -e corpus/blind
          test ! -e corpus/sealed
          test ! -e corpus/development_truth
      - name: Download ONLY reserved blind TEST structural candidate identities
        run: |
          mkdir -p test-structure-only
          gh run download 40213970222 --repo kys928/TriQTO \
            --name prospective-test-structural-identities --dir test-structure-only
          test -s test-structure-only/prospective-test-structural-identities.json
      - name: Independently propose 96 new family structures, five-key collision-free against known sources and TEST
        run: |
          python scripts/cohort/plan_fresh_i2_selection_identities.py \
            --existing corpus \
            --early docs/evidence/finite_shot_cohort/historical-exclusions.json \
            --extra docs/evidence/finite_shot_cohort/additional-exclusions.json \
            --reserved-test test-structure-only/prospective-test-structural-identities.json \
            --output fresh-I2-SELECTION-structural-identities.json
          test ! -e corpus/blind
          test ! -e corpus/sealed
          test ! -e fresh-I2-SELECTION-measurements.npz
      - uses: actions/upload-artifact@v4
        with:
          name: fresh-I2-SELECTION-circuit-identities-only
          path: fresh-I2-SELECTION-structural-identities.json
          retention-days: 90
