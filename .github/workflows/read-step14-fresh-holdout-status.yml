name: Read Step-14 Fresh Holdout Status

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/read-step14-fresh-holdout-status.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_S3_ENDPOINT: ${{ vars.RUNPOD_S3_ENDPOINT }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet boto3
      - name: Read control status and worker log tail only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          import boto3
          from botocore.config import Config
          from botocore.exceptions import ClientError
          bucket=os.environ['RUNPOD_NETWORK_VOLUME_ID']
          prefix='triqto-control/runs/step14-equivalence-aware-fresh-holdout-20260910/run-1789309824-89a2a439/'
          s3=boto3.client('s3',endpoint_url=os.environ['RUNPOD_S3_ENDPOINT'],region_name=os.environ['RUNPOD_DATACENTER_ID'].lower(),aws_access_key_id=os.environ['RUNPOD_S3_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['RUNPOD_S3_SECRET_ACCESS_KEY'],config=Config(signature_version='s3v4'))
          def read(name):
              try:
                  return s3.get_object(Bucket=bucket,Key=prefix+name)['Body'].read().decode('utf-8')
              except ClientError as exc:
                  if str(exc.response.get('Error',{}).get('Code','')) in {'NoSuchKey','404','NotFound'}: return None
                  raise
          status=read('status.json')
          print('=== STATUS ===')
          print(status or 'MISSING')
          log=read('worker.log') or ''
          print('=== WORKER LOG TAIL ===')
          print(log[-12000:])
          PY
