name: RunPod v2 Smoke Test

on:
  push:
    branches: [infra/runpod-control-plane]
    paths:
      - ".github/workflows/runpod-v2-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_S3_ENDPOINT: ${{ vars.RUNPOD_S3_ENDPOINT }}
      RUNPOD_ALLOWED_GPU_TYPES: ${{ vars.RUNPOD_ALLOWED_GPU_TYPES }}
      RUNPOD_IMAGE_NAME: ${{ vars.RUNPOD_IMAGE_NAME }}
      RUNPOD_MAX_READ_TEXT_BYTES: ${{ vars.RUNPOD_MAX_READ_TEXT_BYTES }}
      RUNPOD_MAX_ARTIFACT_BYTES: ${{ vars.RUNPOD_MAX_ARTIFACT_BYTES }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install boto3
        run: python -m pip install --quiet boto3

      - name: Compile v2 controller
        run: python -m py_compile scripts/runpod_control_v2.py

      - name: Read-only S3 list through v2 controller
        run: python scripts/runpod_control_v2.py execute --job runpod/examples/storage_list.json

      - name: Reconcile with no required GPU launch
        run: python scripts/runpod_control_v2.py reconcile-detached
