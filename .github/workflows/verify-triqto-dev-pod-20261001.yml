name: Verify TriQTO Dev Pod 2026-10-01

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-triqto-dev-pod-20261001.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      POD_ID: cl9fvwi0voa0zh
    steps:
      - name: Verify pod state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.request
          pod_id = os.environ['POD_ID']
          headers = {
              'Authorization': f"Bearer {os.environ['RUNPOD_API_KEY'].strip()}",
              'Accept': 'application/json',
              'User-Agent': 'TriQTO-GitHub-PodVerify/1',
          }
          last = None
          for _ in range(12):
              req = urllib.request.Request(f'https://rest.runpod.io/v1/pods/{pod_id}', headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  pod = json.loads(response.read().decode('utf-8'))
              runtime = pod.get('runtime') or {}
              last = {
                  'pod_id': pod.get('id'),
                  'name': pod.get('name'),
                  'desired_status': pod.get('desiredStatus'),
                  'uptime_seconds': runtime.get('uptimeInSeconds'),
                  'gpu_count': runtime.get('gpus'),
                  'cost_per_hour_usd': pod.get('adjustedCostPerHr', pod.get('costPerHr')),
              }
              print('TRIQTO_DEV_POD_VERIFY=' + json.dumps(last, sort_keys=True))
              if pod.get('desiredStatus') == 'RUNNING' and runtime:
                  break
              time.sleep(5)
          if not last or last.get('desired_status') != 'RUNNING':
              raise SystemExit('Pod did not reach RUNNING state')
          PY
