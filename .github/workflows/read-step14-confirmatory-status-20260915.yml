name: Read Step-14 Confirmatory Worker Status

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/read-step14-confirmatory-status-20260915.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_S3_ENDPOINT: ${{ vars.RUNPOD_S3_ENDPOINT }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet boto3
      - shell: bash
        run: |
          python - <<'PY'
          import json, os
          import boto3
          from botocore.config import Config
          from botocore.exceptions import ClientError
          job='step14-equivalence-aware-fresh-holdout-confirmatory-20260915'
          run='run-1789456907-92ef7ccb'
          base=f'triqto-control/runs/{job}/{run}'
          s3=boto3.client('s3',endpoint_url=os.environ['RUNPOD_S3_ENDPOINT'],region_name=os.environ['RUNPOD_DATACENTER_ID'].lower(),aws_access_key_id=os.environ['RUNPOD_S3_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['RUNPOD_S3_SECRET_ACCESS_KEY'],config=Config(signature_version='s3v4'))
          b=os.environ['RUNPOD_NETWORK_VOLUME_ID']
          def maybe(k):
              try: return s3.get_object(Bucket=b,Key=k)['Body'].read()
              except ClientError as e:
                  if str(e.response.get('Error',{}).get('Code','')) in {'NoSuchKey','404'}: return None
                  raise
          st=maybe(base+'/status.json')
          lg=maybe(base+'/worker.log')
          print('=== STATUS ===')
          print(st.decode(errors='replace') if st else 'absent')
          print('=== WORKER LOG TAIL ===')
          if lg:
              print('\n'.join(lg.decode(errors='replace').splitlines()[-300:]))
          else:
              print('absent')
          PY
