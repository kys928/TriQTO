name: TriQTO full 60-family blind TEST structural reconstruction
on:
  push:
    branches: [research/lineage-remedy-blindtest-20261025]
    paths: ['.github/workflows/triqto-test-60family-reconstruct.yml']
permissions:
  contents: read
jobs:
  prove-reconstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install frozen simulator dependencies
        run: python -m pip install --quiet -r requirements-cohort.txt
      - name: Download prospective 60-family public identity commitment
        run: |
          mkdir -p candidate-only
          gh run download 40213970222 --repo kys928/TriQTO \
            --name prospective-test-structural-identities --dir candidate-only
          test -s candidate-only/prospective-test-structural-identities.json
      - name: Reconstruct all 240 circuit roots, never acquire TEST observations or labels
        run: |
          python scripts/cohort/build_blind_replacement_test_v2.py \
            --identity-preflight-only \
            --candidates candidate-only/prospective-test-structural-identities.json \
            --output never-create-real-test \
            --recipient-public-key docs/evidence/finite_shot_cohort/test_sealing_public_key.pem
          test ! -e never-create-real-test
