name: TriQTO RunPod Infrastructure Smoke

on:
  push:
    branches: [main]
    paths:
      - "runpod/smoke/*.json"
  workflow_dispatch:
    inputs:
      request_path:
        description: "Smoke request JSON path"
        required: true
        default: "runpod/examples/infra_smoke_request.json"
        type: string

permissions:
  contents: read

concurrency:
  group: triqto-runpod-infra-smoke
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_S3_ENDPOINT: ${{ vars.RUNPOD_S3_ENDPOINT }}
      RUNPOD_ALLOWED_GPU_TYPES: ${{ vars.RUNPOD_ALLOWED_GPU_TYPES }}
      RUNPOD_IMAGE_NAME: ${{ vars.RUNPOD_IMAGE_NAME }}
      RUNPOD_CONTAINER_REGISTRY_AUTH_ID: ${{ vars.RUNPOD_CONTAINER_REGISTRY_AUTH_ID }}
      MANUAL_REQUEST_PATH: ${{ inputs.request_path }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install boto3
        run: python -m pip install --quiet boto3

      - name: Determine smoke request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            request="$MANUAL_REQUEST_PATH"
          else
            request="$(git diff --name-only "$GITHUB_SHA^" "$GITHUB_SHA" -- 'runpod/smoke/*.json' | head -n 1)"
          fi
          if [[ ! "$request" =~ ^runpod/[A-Za-z0-9_./-]+\.json$ ]]; then
            echo "Unsafe or missing smoke request path: $request" >&2
            exit 2
          fi
          test -f "$request"
          echo "path=$request" >> "$GITHUB_OUTPUT"

      - name: Launch detached infrastructure smoke Pod
        run: python scripts/runpod_infra_smoke.py --request "${{ steps.request.outputs.path }}"
