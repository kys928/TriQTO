name: Read Step-14 Fresh Holdout QC

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "runpod/step14_fresh_holdout_read/*.json"

permissions:
  contents: read

jobs:
  read-qc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_S3_ENDPOINT: ${{ vars.RUNPOD_S3_ENDPOINT }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install boto3
        run: python -m pip install --quiet boto3
      - name: Read only blind-safe holdout QC JSON
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          import boto3
          from botocore.config import Config

          bucket = os.environ["RUNPOD_NETWORK_VOLUME_ID"]
          endpoint = os.environ.get("RUNPOD_S3_ENDPOINT", "").strip() or f"https://s3api-{os.environ['RUNPOD_DATACENTER_ID'].lower()}.runpod.io/"
          s3 = boto3.client(
              "s3",
              endpoint_url=endpoint,
              region_name=os.environ["RUNPOD_DATACENTER_ID"].lower(),
              aws_access_key_id=os.environ["RUNPOD_S3_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["RUNPOD_S3_SECRET_ACCESS_KEY"],
              config=Config(signature_version="s3v4", retries={"max_attempts":8,"mode":"standard"}),
          )
          pointer_key = "triqto-data/step14_equivalence_aware_fresh_holdout/current_fresh_holdout.json"
          pointer = json.loads(s3.get_object(Bucket=bucket, Key=pointer_key)["Body"].read().decode())
          if pointer.get("status") != "FRESH_HOLDOUT_GENERATED_UNEVALUATED" or bool(pointer.get("model_evaluated", True)):
              raise RuntimeError(f"unsafe or unexpected holdout pointer: {pointer}")
          product_dir = str(pointer["product_dir"])
          prefix = product_dir.removeprefix("/workspace/").rstrip("/")
          if not prefix.startswith("triqto-data/step14_equivalence_aware_fresh_holdout/fresh_holdout_"):
              raise RuntimeError(f"unexpected product prefix: {prefix}")
          allowed = [
              "dataset_complete.json",
              "eda_pre_preprocessing.json",
              "preprocessing_audit.json",
              "eda_post_preprocessing.json",
          ]
          print("=== CURRENT_FRESH_HOLDOUT_POINTER ===")
          print(json.dumps(pointer, indent=2, sort_keys=True))
          for name in allowed:
              key = f"{prefix}/{name}"
              if any(token in key for token in ("sealed_truth", "manifests", "blind_artifacts")):
                  raise RuntimeError("reader attempted a forbidden holdout path")
              payload = json.loads(s3.get_object(Bucket=bucket, Key=key)["Body"].read().decode())
              print(f"=== {name} ===")
              print(json.dumps(payload, indent=2, sort_keys=True))
          PY
