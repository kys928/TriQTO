name: Watch Step-14 Oracle R2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/runpod-watch-step14-oracle-r2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_S3_ENDPOINT: ${{ vars.RUNPOD_S3_ENDPOINT }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install boto3
        run: python -m pip install --quiet boto3
      - name: Watch exact frozen oracle diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import time
          import boto3
          from botocore.config import Config
          from botocore.exceptions import ClientError

          JOB_ID = 'step14-oracle-raw-evidence-20260902-r2'
          CONTROL_RUN_ID = 'run-1788343215-fee52ba5'
          STATUS_KEY = f'triqto-control/runs/{JOB_ID}/{CONTROL_RUN_ID}/status.json'
          LOG_KEY = f'triqto-control/runs/{JOB_ID}/{CONTROL_RUN_ID}/worker.log'
          HISTORY_KEY = f'triqto-control/history/{CONTROL_RUN_ID}.json'
          RESULT_POINTER_KEY = 'triqto-data/step14_oracle_raw_evidence_ceiling/current_oracle_raw_evidence_diagnostic.json'
          TERMINAL = {'completed', 'failed'}

          bucket = os.environ['RUNPOD_NETWORK_VOLUME_ID']
          client = boto3.client(
              's3',
              endpoint_url=os.environ['RUNPOD_S3_ENDPOINT'],
              region_name=os.environ['RUNPOD_DATACENTER_ID'].lower(),
              aws_access_key_id=os.environ['RUNPOD_S3_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['RUNPOD_S3_SECRET_ACCESS_KEY'],
              config=Config(signature_version='s3v4', retries={'max_attempts': 8, 'mode': 'standard'}),
          )

          def maybe_text(key):
              try:
                  return client.get_object(Bucket=bucket, Key=key)['Body'].read().decode('utf-8')
              except ClientError as exc:
                  if exc.response.get('Error', {}).get('Code') in {'NoSuchKey', '404'}:
                      return None
                  raise

          startup_reported = False
          root32_reported = False
          last_progress = -1
          start = time.time()

          while True:
              status_text = maybe_text(STATUS_KEY)
              log_text = maybe_text(LOG_KEY) or ''
              history_text = maybe_text(HISTORY_KEY)

              if status_text is None:
                  if history_text is not None:
                      print('TERMINAL_HISTORY_BEFORE_WORKER_STATUS')
                      print(history_text)
                      raise SystemExit(1)
                  if int(time.time() - start) % 60 < 20:
                      print('waiting for worker status...', flush=True)
                  time.sleep(20)
                  continue

              status = json.loads(status_text)
              if not startup_reported:
                  print('WORKER_STATUS_APPEARED')
                  print(json.dumps(status, indent=2, sort_keys=True), flush=True)
                  startup_reported = True

              matches = [int(v) for v in re.findall(r'oracle/raw feature extraction\s+(\d+)/', log_text)]
              if matches:
                  progress = max(matches)
                  if progress > last_progress:
                      print(f'FEATURE_EXTRACTION_PROGRESS={progress}', flush=True)
                      last_progress = progress
                  if progress >= 5000 and not root32_reported:
                      print('VERIFIED_PAST_ROOT_32=YES', flush=True)
                      print('Reason: frozen diagnostic reached feature extraction >=5000; the old deterministic crash was at root 32.', flush=True)
                      root32_reported = True

              state = str(status.get('state', ''))
              if state in TERMINAL:
                  print('TERMINAL_STATUS')
                  print(status_text)
                  print('FINAL_WORKER_LOG')
                  print(log_text)
                  if history_text is not None:
                      print('FINAL_HISTORY')
                      print(history_text)
                  if state == 'completed':
                      pointer_text = maybe_text(RESULT_POINTER_KEY)
                      if pointer_text is None:
                          print('RESULT_POINTER_NOT_YET_VISIBLE')
                      else:
                          print('RESULT_POINTER')
                          print(pointer_text)
                          pointer = json.loads(pointer_text)
                          diagnostic_dir = str(pointer['diagnostic_dir'])
                          if not diagnostic_dir.startswith('/workspace/'):
                              raise RuntimeError(f'Unexpected diagnostic_dir {diagnostic_dir!r}')
                          result_key = diagnostic_dir[len('/workspace/'):].rstrip('/') + '/diagnostic_result.json'
                          complete_key = diagnostic_dir[len('/workspace/'):].rstrip('/') + '/diagnostic_complete.json'
                          result_text = maybe_text(result_key)
                          complete_text = maybe_text(complete_key)
                          print('DIAGNOSTIC_COMPLETE')
                          print(complete_text or 'missing')
                          print('DIAGNOSTIC_RESULT')
                          print(result_text or 'missing')
                  if not root32_reported:
                      print('VERIFIED_PAST_ROOT_32=NO_EXPLICIT_5000_MARKER')
                  raise SystemExit(0 if state == 'completed' else 1)

              time.sleep(20)
          PY
