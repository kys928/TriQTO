name: Verify Step-14 Oracle R2 Past Root 32

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/runpod-verify-step14-oracle-r2-root32.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_S3_ENDPOINT: ${{ vars.RUNPOD_S3_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install boto3
        run: python -m pip install --quiet boto3
      - name: Wait for proof past old root-32 failure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import time
          import boto3
          from botocore.config import Config
          from botocore.exceptions import ClientError

          JOB_ID = 'step14-oracle-raw-evidence-20260902-r2'
          CONTROL_RUN_ID = 'run-1788343215-fee52ba5'
          STATUS_KEY = f'triqto-control/runs/{JOB_ID}/{CONTROL_RUN_ID}/status.json'
          LOG_KEY = f'triqto-control/runs/{JOB_ID}/{CONTROL_RUN_ID}/worker.log'
          HISTORY_KEY = f'triqto-control/history/{CONTROL_RUN_ID}.json'
          bucket = os.environ['RUNPOD_NETWORK_VOLUME_ID']
          client = boto3.client(
              's3', endpoint_url=os.environ['RUNPOD_S3_ENDPOINT'],
              region_name=os.environ['RUNPOD_DATACENTER_ID'].lower(),
              aws_access_key_id=os.environ['RUNPOD_S3_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['RUNPOD_S3_SECRET_ACCESS_KEY'],
              config=Config(signature_version='s3v4', retries={'max_attempts': 8, 'mode': 'standard'}),
          )

          def maybe_text(key):
              try:
                  return client.get_object(Bucket=bucket, Key=key)['Body'].read().decode('utf-8')
              except ClientError as exc:
                  if exc.response.get('Error', {}).get('Code') in {'NoSuchKey', '404'}:
                      return None
                  raise

          deadline = time.time() + 25 * 60
          while time.time() < deadline:
              status_text = maybe_text(STATUS_KEY)
              log_text = maybe_text(LOG_KEY) or ''
              history_text = maybe_text(HISTORY_KEY)
              matches = [int(v) for v in re.findall(r'oracle/raw feature extraction\s+(\d+)/', log_text)]
              if matches and max(matches) >= 5000:
                  print('VERIFIED_PAST_ROOT_32=YES')
                  print(f'MAX_FEATURE_EXTRACTION_PROGRESS={max(matches)}')
                  if status_text:
                      print('STATUS_JSON')
                      print(status_text)
                  print('WORKER_LOG_TAIL')
                  print('\n'.join(log_text.splitlines()[-80:]))
                  raise SystemExit(0)
              if status_text:
                  state = str(json.loads(status_text).get('state', ''))
                  if state in {'completed', 'failed'}:
                      print('TERMINAL_BEFORE_5000_MARKER')
                      print(status_text)
                      print(log_text)
                      raise SystemExit(1)
              elif history_text:
                  print('HISTORY_TERMINAL_BEFORE_STATUS_OR_5000')
                  print(history_text)
                  raise SystemExit(1)
              time.sleep(15)
          print('TIMEOUT_WAITING_FOR_5000_MARKER')
          if maybe_text(STATUS_KEY): print(maybe_text(STATUS_KEY))
          if maybe_text(LOG_KEY): print(maybe_text(LOG_KEY))
          raise SystemExit(1)
          PY
