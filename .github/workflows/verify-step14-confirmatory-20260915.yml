name: Verify Step-14 Fresh Holdout Confirmatory Result

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-step14-confirmatory-20260915.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_S3_ENDPOINT: ${{ vars.RUNPOD_S3_ENDPOINT }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet boto3
      - name: Wait for and verify confirmatory result bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, time
          import boto3
          from botocore.config import Config
          from botocore.exceptions import ClientError

          JOB_ID = "step14-equivalence-aware-fresh-holdout-confirmatory-20260915"
          CONTROL_RUN_ID = "run-1789456907-92ef7ccb"
          EXPECTED_PRED_COMPLETE = "sha256:e6c39fe4a101687a7a911377624f1c626380778162943da2e5a1ee7514648280"
          EXPECTED_HOLDOUT_SHA = "sha256:515cc17016894506e040d79bfef2dd7bf1c605578deccfb4fbef2ba865794675"
          bucket = os.environ["RUNPOD_NETWORK_VOLUME_ID"]
          s3 = boto3.client(
              "s3",
              endpoint_url=os.environ["RUNPOD_S3_ENDPOINT"],
              region_name=os.environ["RUNPOD_DATACENTER_ID"].lower(),
              aws_access_key_id=os.environ["RUNPOD_S3_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["RUNPOD_S3_SECRET_ACCESS_KEY"],
              config=Config(signature_version="s3v4", retries={"max_attempts": 8, "mode": "standard"}),
          )
          def get(key):
              return s3.get_object(Bucket=bucket, Key=key)["Body"].read()
          def maybe(key):
              try:
                  return get(key)
              except ClientError as exc:
                  if str(exc.response.get("Error", {}).get("Code", "")) in {"NoSuchKey", "404"}:
                      return None
                  raise
          def sha(raw):
              return "sha256:" + hashlib.sha256(raw).hexdigest()

          control_key = f"triqto-control/runs/{JOB_ID}/{CONTROL_RUN_ID}/status.json"
          pointer_key = "triqto-data/step14_equivalence_aware_fresh_holdout_confirmation/current_confirmatory_result.json"
          pointer_raw = None
          for attempt in range(1, 361):
              pointer_raw = maybe(pointer_key)
              status_raw = maybe(control_key)
              if pointer_raw is not None:
                  print(f"confirmatory pointer found on poll {attempt}", flush=True)
                  break
              if status_raw is not None:
                  status = json.loads(status_raw)
                  state = str(status.get("state", "")).lower()
                  print(f"poll {attempt}: worker_state={state}", flush=True)
                  if state in {"failed", "error", "cancelled", "canceled"}:
                      log_key = f"triqto-control/runs/{JOB_ID}/{CONTROL_RUN_ID}/worker.log"
                      log_raw = maybe(log_key)
                      if log_raw is not None:
                          print("=== WORKER LOG TAIL ===")
                          print("\n".join(log_raw.decode(errors="replace").splitlines()[-250:]))
                      raise RuntimeError(f"confirmatory worker failed: {status}")
              time.sleep(15)
          else:
              raise RuntimeError("confirmatory result pointer did not appear within verifier window")

          pointer = json.loads(pointer_raw)
          if pointer.get("status") != "COMPLETE_ONE_SHOT_FRESH_HOLDOUT_CONFIRMATORY_EVALUATION":
              raise RuntimeError(f"unexpected confirmatory pointer status: {pointer}")
          if pointer.get("oracle_free_predictions_complete_sha256") != EXPECTED_PRED_COMPLETE:
              raise RuntimeError("prediction completion identity drift")
          result_dir = str(pointer["result_dir"])
          prefix = result_dir.removeprefix("/workspace/").rstrip("/")
          result_raw = get(prefix + "/confirmatory_result.json")
          complete_raw = get(prefix + "/confirmatory_complete.json")
          result_sha = sha(result_raw)
          complete_sha = sha(complete_raw)
          if result_sha != pointer["confirmatory_result_sha256"]:
              raise RuntimeError("confirmatory result SHA mismatch")
          if complete_sha != pointer["confirmatory_complete_sha256"]:
              raise RuntimeError("confirmatory completion SHA mismatch")
          result = json.loads(result_raw)
          complete = json.loads(complete_raw)
          if complete.get("fresh_holdout_dataset_complete_sha256") != EXPECTED_HOLDOUT_SHA:
              raise RuntimeError("holdout identity drift")
          if complete.get("oracle_free_predictions_complete_sha256") != EXPECTED_PRED_COMPLETE:
              raise RuntimeError("completion prediction identity drift")
          status = json.loads(get(control_key))
          if str(status.get("state", "")).lower() != "completed" or int(status.get("returncode", -1)) != 0:
              raise RuntimeError(f"worker status not cleanly completed: {status}")

          out = {
              "result_id": pointer["result_id"],
              "verdict": result["verdict"],
              "full_support_gates_all_passed": result["full_support_gates_all_passed"],
              "confirmatory_result_sha256": result_sha,
              "confirmatory_complete_sha256": complete_sha,
              "oracle_free_equivalence_aware": result["oracle_free_equivalence_aware"],
              "fit_only_raw_baseline": result["fit_only_raw_baseline"],
              "fit_only_privileged_exact_local_frame_reference": result["fit_only_privileged_exact_local_frame_reference"],
              "paired_equivalence_aware_minus_raw": result["paired_equivalence_aware_minus_raw"],
              "fraction_oracle_canonicalization_gain_recovered": result["fraction_oracle_canonicalization_gain_recovered"],
              "support_gates": result["support_gates"],
              "scientific_boundaries": result["scientific_boundaries"],
              "control_run_id": CONTROL_RUN_ID,
          }
          print("=== VERIFIED_CONFIRMATORY_RESULT ===")
          print(json.dumps(out, indent=2, sort_keys=True))
          PY
