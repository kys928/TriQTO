name: TriQTO custodian attestation and blind-TEST synthetic QA
on:
  push:
    branches: [research/stabilization-gates-20261025]
    paths: ['.github/workflows/triqto-stabilization-custody-qa.yml']
permissions:
  contents: read
jobs:
  scientific-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet "numpy==2.3.2" "pytest==8.4.2" "cryptography==46.0.3"
      - name: Fail-closed custodian and synthetic TEST-blinding tests
        run: |
          python -m pytest -q tests/test_stabilization_research_gates.py tests/test_blinded_test_contract.py
      - name: Validate no TEST generator has yet materialized a corpus
        run: |
          test ! -e corpus
          test ! -e protected-identities.csv
