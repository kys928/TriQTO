name: TriQTO cohort historical identity preflight
on:
  push:
    branches: [research/finite-shot-cohort-20261025]
    paths: ['.github/workflows/triqto-cohort-inventory.yml']
permissions:
  contents: read
jobs:
  read-identities:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_S3_ENDPOINT: ${{ vars.RUNPOD_S3_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet boto3
      - run: python scripts/cohort/s3_exclusion_inventory.py
      - uses: actions/upload-artifact@v4
        with:
          name: historical-exclusions
          path: historical-exclusions.json
          retention-days: 30
