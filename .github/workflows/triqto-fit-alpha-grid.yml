name: TriQTO FIT frozen-network stabilization alpha grid (no SELECTION)
on:
  push:
    branches: [research/remedy-fit-selection-freeze-20261025]
    paths: ['.github/workflows/triqto-fit-alpha-grid.yml']
permissions:
  contents: read
jobs:
  fit-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {start: 8, stop: 16}
          - {start: 16, stop: 24}
          - {start: 24, stop: 32}
          - {start: 32, stop: 40}
    env:
      GH_TOKEN: ${{ github.token }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_S3_ENDPOINT: ${{ vars.RUNPOD_S3_ENDPOINT }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install hash-pinned mechanism dependencies
        run: |
          python -m pip install --quiet -r requirements-cohort.txt
          python -m pip install --quiet "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
      - name: Verify immutable source, extract FIT only
        run: |
          gh release download finite-shot-cohort-20261025-1448ca1ebbdf --repo kys928/TriQTO -D . \
            -p 'TriQTO_Finite_Shot_Cohort_20261025.tar.gz' -p 'SHA256SUMS'
          sha256sum -c SHA256SUMS
          tar -xzf TriQTO_Finite_Shot_Cohort_20261025.tar.gz --wildcards \
            'corpus/roots.json' 'corpus/blind/FIT/*.npz' 'corpus/development_truth/FIT/*.json'
          test ! -e corpus/blind/TEST
          test ! -e corpus/blind/SELECTION
          test ! -e corpus/sealed
      - name: Real frozen mechanism head, all predeclared intervention alphas, FIT only
        run: |
          python scripts/cohort/fit_alpha_grid_shard.py --corpus corpus \
            --start ${{ matrix.start }} --stop ${{ matrix.stop }} \
            --output fit-grid-${{ matrix.start }}-${{ matrix.stop }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: fit-alpha-shard-${{ matrix.start }}-${{ matrix.stop }}
          path: fit-grid-${{ matrix.start }}-${{ matrix.stop }}.json
          retention-days: 30
  fit-review:
    needs: fit-grid
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet numpy==2.3.2
      - name: Download only four FIT alpha shards from this run
        run: |
          mkdir -p fit-results
          gh run download ${{ github.run_id }} --repo kys928/TriQTO \
            --pattern 'fit-alpha-shard-*' --dir fit-results
      - name: Prespecified family-disjoint alpha rule
        run: |
          python scripts/cohort/reduce_fit_alpha_grid.py --input-directory fit-results \
            --output fit-alpha-screen-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: fit-alpha-screen-report
          path: fit-alpha-screen-report.json
          retention-days: 30
