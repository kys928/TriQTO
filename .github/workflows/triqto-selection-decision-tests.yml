name: TriQTO selection decision mechanical tests — no data access
on:
  push:
    branches: [research/lineage-remedy-blindtest-20261025]
    paths: ['.github/workflows/triqto-selection-decision-tests.yml']
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet numpy==2.3.2 pytest==8.4.2
      - run: python -m pytest -q tests/test_remedy_feature_transforms.py tests/test_select_stabilization_remedy.py
